<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="img/favicon.jpg" type="image/jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matteo Bettini</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

    body {
      overflow:hidden;
      font-family:'Times New Roman',Times,serif;
      width:100vw; height:100vh;
      cursor:pointer;
    }


    #bg {
      position:fixed; inset:0;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* ---- Thumbnail strip ---- */
    #thumbs {
      position:fixed; top:0px; left:0px; right:0px;
      display:flex; gap:0px;
      overflow-x:auto; overflow-y:hidden;
      scrollbar-width:none;              /* Firefox */
      -webkit-overflow-scrolling:touch;
      z-index:100;
    }
    #thumbs::-webkit-scrollbar { display:none; }

    #thumbs button {
      flex:0 0 auto;
      display:block;
      border:0; padding:0; background:none;
      cursor:pointer;
      opacity:100;
      transition:opacity 0.15s;
    }
    #thumbs button:hover,
    #thumbs button.active { opacity:1; }
    #thumbs button:focus-visible { outline:1px solid currentColor; outline-offset:1px; opacity:1; }

    #thumbs img {
      display:block;
      height:44px; width:auto;
      pointer-events:none;
    }

    #footer {
      position:fixed; bottom:2px; left:2px;
      transform:rotate(2deg);
      width:calc(100vw - 10px); font-size:1.3em; line-height:1.1;
      z-index:100; pointer-events:all;
      mix-blend-mode:normal;
    }

    #arch-name { letter-spacing:0.2rem; }

    #footer:hover { mix-blend-mode:normal; }
    #footer a { color:inherit; text-decoration:underline; pointer-events:all; }

    @media (max-width:768px) {
      #footer { font-size:1.1em; line-height:1.1; }
      #thumbs img { height:34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #thumbs button { transition:none; }
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <nav id="thumbs" aria-label="Images"></nav>

  <p id="footer">
     <span id="arch-name"> Matteo Bettini </span> <br>
    Information design and art practice<br>
    Rotterdam (NL), Sep 2026<br>
    <a href="mailto:mte.bettini@gmail.com">mte.bettini@gmail.com</a><br>
    <a href="https://www.instagram.com/600mt/">Instagram</a>
  </p>
  <script>
    const IMAGES_DESKTOP = [
  'img/mam_1_hor.jpg',
  'img/viewingconditions_3.jpg',
  'img/dem2_1.jpg',
  'img/22x11x11_5_rotate.jpg',
  'img/aplace_2.jpg',
  'img/ppv_5.jpg',
  'img/Agreat_2.jpg',
  'img/FragmentsofDemocracy_1_rotate.jpg',
  'img/ilsignore_7.jpg',
];

const IMAGES_MOBILE = [
  'img/mam_5.jpg',
  'img/viewingconditions_2.jpg',
  'img/22x11x11_6.jpg',
  'img/ilsignore_8.jpg',
  'img/FragmentsofDemocracy_1.jpg',
  'img/Agreat_4.jpg',
  'img/dem2_2.jpg',
  'img/IMG_8522.jpg',
];

    const isMobile = window.innerWidth <= 768;
    const IMAGES = isMobile ? IMAGES_MOBILE : IMAGES_DESKTOP;

    const footer = document.getElementById('footer');

    // Sample average brightness of the image pixels behind the footer area
    // then set footer color to black or white for maximum contrast
    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');

    // Per-image color overrides (when auto-detection is wrong)
    const COLOR_OVERRIDES = {
      'img/IMG_8522.jpg': '#fff',
      'img/viewingconditions_3.jpg': '#fff',
    };

    function updateFooterColor(src) {
      if (COLOR_OVERRIDES[src]) { footer.style.color = COLOR_OVERRIDES[src]; return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        // footer occupies bottom ~20% of screen, left ~60% of width
        const sw = img.naturalWidth;
        const sh = img.naturalHeight;
        // cover scaling: find the actual rendered rect
        const vw = window.innerWidth, vh = window.innerHeight;
        const scale = Math.max(vw / sw, vh / sh);
        const rw = sw * scale, rh = sh * scale;
        const ox = (rw - vw) / 2, oy = (rh - vh) / 2;

        // footer region in image coords
        const footerH = vh * 0.28;
        const sx = ox / scale;
        const sy = (vh - footerH + oy) / scale;
        const sampleW = (vw * 0.6) / scale;
        const sampleH = footerH / scale;

        canvas.width  = 32;
        canvas.height = 8;
        ctx.drawImage(img, sx, sy, sampleW, sampleH, 0, 0, 32, 8);

        const d = ctx.getImageData(0, 0, 32, 8).data;
        let r = 0, g = 0, b = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
          r += d[i]; g += d[i+1]; b += d[i+2]; n++;
        }
        r /= n; g /= n; b /= n;
        // perceptual luminance
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        footer.style.color = lum > 140 ? '#000' : '#fff';
      };
      img.onerror = () => { footer.style.color = '#fff'; };
      img.src = src;
    }

    const bg = document.getElementById('bg');
    let current = Math.floor(Math.random() * IMAGES.length);

    // ---- Build thumbnail strip ----
    const thumbs = document.getElementById('thumbs');
    const thumbEls = IMAGES.map((src, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('aria-label', `Show image ${i + 1}`);
      const im = document.createElement('img');
      im.src = src;
      im.alt = '';
      im.draggable = false;
      btn.appendChild(im);
      btn.addEventListener('click', () => {
        current = i;
        show(current);
      });
      thumbs.appendChild(btn);
      return btn;
    });

    function markActive(index) {
      thumbEls.forEach((el, i) => el.classList.toggle('active', i === index));
      // keep the active thumbnail in view when the strip overflows (mobile)
      const t = thumbEls[index];
      if (thumbs.scrollWidth > thumbs.clientWidth) {
        const left = t.offsetLeft - (thumbs.clientWidth - t.offsetWidth) / 2;
        thumbs.scrollTo({ left, behavior: 'smooth' });
      }
    }

    function show(index) {
      const src = IMAGES[index];
      bg.style.backgroundImage = `url('${src}')`;
      updateFooterColor(src);
      markActive(index);
    }

    function next() {
      current = (current + 1) % IMAGES.length;
      show(current);
    }

    // Preload all images
    IMAGES.forEach(src => { const i = new Image(); i.src = src; });

    // Show first image instantly
    show(current);

    // Desktop: click or scroll → next
    document.addEventListener('click', e => {
      if (e.target.tagName === 'A') return;
      if (e.target.closest('#footer')) return;
      if (e.target.closest('#thumbs')) return;
      next();
    });

    let wheelLocked = false;
    document.addEventListener('wheel', e => {
      if (e.target.closest('#thumbs')) return;
      if (wheelLocked) return;
      wheelLocked = true;
      next();
      setTimeout(() => { wheelLocked = false; }, 600);
    }, { passive: true });

    // Mobile: tap → next (touchend with no movement)
    let t0 = 0, t0y = 0;
    document.addEventListener('touchstart', e => {
      t0  = Date.now();
      t0y = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (e.target.closest('#thumbs')) return;
      const dy  = Math.abs(e.changedTouches[0].clientY - t0y);
      const dt  = Date.now() - t0;
      if (dy < 10 && dt < 300) {
        if (e.target.tagName === 'A') return;
        next();
      }
    }, { passive: true });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
