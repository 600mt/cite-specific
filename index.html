<!DOCTYPE html>
<html>
<head>
  <title>Map Notes</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial', serif; }
    #map { width: 100%; height: 100%; background: #f2efe9; }

    .note-label {
      background: transparent;
      font-family: 'Arial Narrow', 'Times New Roman', serif;
      color: #000000;
      text-shadow: 0 0 4px #e892a2, 0 0 4px #e892a2, 0 0 3px #e892a2;
      line-height: 1.2;
      max-width: 180px;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      cursor: default;
      transition: opacity 0.2s ease;
      opacity: 1;
    }
    .note-title { font-weight: bold; }
    /* !important because MapLibre sets an inline opacity on every marker */
    .labels-dimmed .note-label { opacity: 0.15 !important; }
    .note-label.is-hovered { opacity: 1 !important; z-index: 1; }

    /* Zoomed out: titles only. Hovering (or tapping) a title shows its text
       underneath without pushing the other notes around. */
    .labels-brief .note-desc { display: none; }
    .labels-brief .note-label.is-hovered .note-desc {
      display: block;
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      width: 180px;
    }

    .maplibregl-ctrl-attrib.maplibregl-compact { min-width: 24px; }
    .maplibregl-ctrl-attrib-button { display: block !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="map-notes.js"></script>
  <script>
    // =========================================================================
    // 🎨  MAP PALETTE: coastline, buildings and borders only
    // =========================================================================
    const COLORS = {
      background:      "#ffffff",
      water:           "#aad3df",
      building:        "#d9d0c9",
      buildingOutline: "#c6bbb0",
      boundary:        "#ac46ac",
    };

    const mapStyle = {
      version: 8,
      sources: {
        openmaptiles: { type: "vector", url: "https://tiles.openfreemap.org/planet" }
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": COLORS.background } },
        { id: "water", type: "fill", source: "openmaptiles", "source-layer": "water", paint: { "fill-color": COLORS.water } },
        { id: "building", type: "fill", source: "openmaptiles", "source-layer": "building", minzoom: 14, paint: { "fill-color": COLORS.building, "fill-outline-color": COLORS.buildingOutline } },
        { id: "boundary", type: "line", source: "openmaptiles", "source-layer": "boundary", filter: ["==","admin_level",2], paint: { "line-color": COLORS.boundary, "line-width": 0.8, "line-dasharray": [4,2] } }
      ]
    };

    // Opening view: Europe at country level (Atlantic coast of Portugal → Romania, Sicily → Denmark).
    // fitBounds adapts the zoom to the screen, so phones get the whole frame too.
    const EUROPE_BOUNDS = [[-12, 36], [30, 58]];
    const map = new maplibregl.Map({
      container: 'map', style: mapStyle,
      bounds: EUROPE_BOUNDS, fitBoundsOptions: { padding: 20 },
      attributionControl: false
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
    map.on('load', () => {
      const attrib = document.querySelector('.maplibregl-ctrl-attrib');
      if (attrib) attrib.classList.add('maplibregl-compact');
    });

    // =========================================================================
    // 🔠  ZOOM-DRIVEN TEXT
    // =========================================================================
    const FONT_MIN_PX = 7, FONT_MAX_PX = 15, ZOOM_MIN = 4, ZOOM_MAX = 16;
    const DESC_MIN_ZOOM = 7;   // below this zoom, notes show their title only
    const STACK_GAP_PX = 2;    // space between notes that would otherwise overlap

    function zoomToFontSize(zoom) {
      const t = Math.max(0, Math.min(1, (zoom - ZOOM_MIN) / (ZOOM_MAX - ZOOM_MIN)));
      return FONT_MIN_PX + t * (FONT_MAX_PX - FONT_MIN_PX);
    }

    const mapEl = document.getElementById('map');
    const notes = [];   // { el, marker, lat, lon }

    function showNote(n) {
      const el = document.createElement('div');
      el.className = 'note-label';

      const title = document.createElement('div');
      title.className = 'note-title';
      title.textContent = n.title || '';
      el.appendChild(title);

      if (n.text) {
        const desc = document.createElement('div');
        desc.className = 'note-desc';
        desc.textContent = n.text;
        el.appendChild(desc);
      }

      el.addEventListener('mouseenter', () => { mapEl.classList.add('labels-dimmed'); el.classList.add('is-hovered'); });
      el.addEventListener('mouseleave', () => { mapEl.classList.remove('labels-dimmed'); el.classList.remove('is-hovered'); });

      const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
        .setLngLat([n.lon, n.lat]).addTo(map);
      notes.push({ el, marker, lat: n.lat, lon: n.lon });
    }

    // Notes that would overlap on screen (e.g. several works in one city when
    // zoomed out) are stacked downwards from the northernmost one. As you zoom
    // in they spread apart and settle back on their own locations.
    function declutter() {
      const items = notes.map(n => {
        const p = map.project([n.lon, n.lat]);
        return { n, x: p.x, y: p.y, w: n.el.offsetWidth, h: n.el.offsetHeight };
      }).sort((a, b) => a.y - b.y || a.x - b.x);

      const placed = [];
      for (const it of items) {
        const left = it.x - it.w / 2, right = it.x + it.w / 2;
        const home = it.y - it.h / 2;
        let top = home;
        for (let moved = true; moved; ) {
          moved = false;
          for (const o of placed) {
            if (left < o.right && right > o.left &&
                top < o.bottom + STACK_GAP_PX && top + it.h > o.top - STACK_GAP_PX) {
              top = o.bottom + STACK_GAP_PX;
              moved = true;
            }
          }
        }
        placed.push({ left, right, top, bottom: top + it.h });
        it.n.marker.setOffset([0, top - home]);
      }
    }

    function relayout() {
      const zoom = map.getZoom();
      const size = zoomToFontSize(zoom) + 'px';
      for (const n of notes) n.el.style.fontSize = size;
      mapEl.classList.toggle('labels-brief', zoom < DESC_MIN_ZOOM);
      declutter();
    }

    // =========================================================================
    // 📥  LOAD the portfolio notes from map-notes.js
    // =========================================================================
    const entries = window.MAP_NOTES || [];
    if (!window.MAP_NOTES) console.warn('map-notes.js not found or empty');
    entries
      .filter(n => typeof n.lat === 'number' && typeof n.lon === 'number')
      .forEach(showNote);

    relayout();
    map.on('zoom', relayout);
    map.on('rotate', relayout);
    map.on('pitch', relayout);
    if (document.fonts) document.fonts.ready.then(relayout);
  </script>
</body>
</html>
