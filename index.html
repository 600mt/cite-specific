<!DOCTYPE html>
<html>
<head>
  <title>Map Notes</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap');

    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial','IM Fell English', serif; }
    #map { width: 100%; height: 100%; background: #f2efe9; }

    /* ── Bottom control buttons ──────────────────────────────── */
    .ctrl-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 12px 30px;
border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'Arial', 'Times New Roman', serif;
      font-size: 12px;
      color: #000;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:hover {  }
    .drop-btn   { bottom: 5vh; background: #000; color: #fff; }
    .drop-btn:active { background: #333; }
    .toggle-btn { bottom: calc(5vh + 58px); background: #fff; font-size: 13px; padding: 9px 22px; }
    .toggle-btn:active { background: #eee; }
    .toggle-btn.active { background: #000; color: #fff; }

    /* Sync status pill, top-left */
    .sync-pill {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1000;
      background: #fff;
border: none;
      border-radius: 100px;
      padding: 6px 14px;
      font-family: 'Arial', 'Times New Roman', serif;
      font-size: 12px;
      color: #000;
      display: flex; align-items: center; gap: 7px;
      max-width: 70vw;
    }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #999; flex: none; }
    .sync-dot.ok      { background: #2d6a4f; }
    .sync-dot.pending { background: #e0a000; }
    .sync-dot.err     { background: #a33; }

    .note-label {
      background: transparent;
      font-family: 'Arial Narrow', 'Times New Roman', serif;
      color: #000000;
      text-shadow: 0 0 4px #e892a2, 0 0 4px #e892a2, 0 0 3px #e892a2;
      line-height: 1.2;
      max-width: 180px;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      cursor: default;
      transition: opacity 0.2s ease, font-size 0.15s ease;
      opacity: 1;
    }
    .labels-dimmed .note-label { opacity: 0.15; }
    .note-label.is-hovered { opacity: 1 !important; }
    body.base-hidden .note-label { text-shadow: none; }

    .maplibregl-popup-content {
      background: #fff !important;
      border-radius: 6px !important;
      padding: 16px !important;
      font-family: 'Arial', 'IM Fell English', serif !important;
      min-width: 220px;
    }
    .maplibregl-popup-tip { display: none !important; }
    .maplibregl-popup-close-button { font-size: 18px; color: #000; padding: 4px 8px; }

    .note-popup { display: flex; flex-direction: column; gap: 10px; }
    .note-popup h3 { margin: 0 0 4px; font-family: 'Arial', 'Times New Roman', serif; font-size: 12px; color: #666; font-weight: normal; }

    .note-popup textarea { padding: 8px; border: 1px solid #000; background: #fff; border-radius: 4px; font-size: 14px; font-family: 'Arial', 'IM Fell English', serif; resize: vertical; color: #000; outline: none; line-height: 1.5; }
    .note-popup textarea:focus { border-color: #000; background: white; }

    .save-btn { background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 100px; cursor: pointer; font-family: 'Arial', 'Times New Roman', serif; font-size: 12px; transition: background 0.2s; }
    .save-btn:hover { background: #333; }

    /* ── Mobile bottom sheet ─────────────────────────────────── */
    #mobile-sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 2000; align-items: flex-end; justify-content: center; }
    #mobile-sheet-overlay.open { display: flex; }
    #mobile-sheet { background: #fff; border-radius: 18px 18px 0 0; width: 98%; margin: 0 1%; max-height: 90vh; overflow-y: auto; padding: 20px 20px 36px; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.32,1,0.45,1); display: flex; flex-direction: column; gap: 14px; }
    #mobile-sheet-overlay.open #mobile-sheet { transform: translateY(0); }
    #sheet-handle { width: 40px; height: 4px; background: #000; border-radius: 2px; margin: 0 auto -6px; }
    #sheet-header { display: flex; align-items: center; justify-content: space-between; }
    #sheet-header h3 { margin: 0; font-family: 'Arial', 'Times New Roman', serif; font-size: 16px; color: #000; font-weight: normal; font-style: italic; }
    #sheet-close { background: none; border: none; font-size: 22px; color: #000; cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 50%; }
    #sheet-close:hover { background: #eee; }
    #sheet-textarea { width: 100%; padding: 12px; border: 1px solid #000; background: white; border-radius: 10px; font-size: 16px; font-family: 'Arial', 'Times New Roman', serif; resize: none; color: #000; outline: none; line-height: 1.6; min-height: 110px; }
    #sheet-textarea:focus { border-color: #000; }
    #sheet-save { background: #000; color: #fff; border: none; padding: 15px; border-radius: 100px; cursor: pointer; font-family: 'Arial', 'Times New Roman', serif; font-size: 15px; width: 100%; transition: background 0.2s; min-height: 52px; }
    #sheet-save:active { background: #333; }

    @media (min-width: 600px) { #mobile-sheet-overlay { display: none !important; } }

    .maplibregl-ctrl-group { background: #fff !important;  }
    .maplibregl-ctrl-group button { background: transparent !important; }
    .maplibregl-ctrl-attrib.maplibregl-compact { min-width: 24px; }
    .maplibregl-ctrl-attrib-button { display: block !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="sync-pill" id="sync-pill">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-text">loading…</span>
  </div>

  <div class="ctrl-btn drop-btn" onclick="dropNote()">Drop a note here</div>
  <div class="ctrl-btn toggle-btn" id="toggle-base" onclick="toggleBaseMap()">Hide base map</div>

  <!-- Mobile bottom sheet -->
  <div id="mobile-sheet-overlay">
    <div id="mobile-sheet">
      <div id="sheet-handle"></div>
      <div id="sheet-header">
        <h3>Leave a note here</h3>
        <button id="sheet-close">×</button>
      </div>
      <textarea id="sheet-textarea" rows="5" placeholder="Write your note here…"></textarea>
      <button id="sheet-save">Save Note</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // ─── CONFIG ────────────────────────────────────────────────────────────────
    const supabaseUrl = 'https://owovclgqfngxektsuxcr.supabase.co';
    const supabaseKey = 'sb_publishable_DeJSOJ2m6jzH6md1MXYpmA_JkQgH7sZ';
    const TABLE = 'citespecific';   // ← your actual Supabase table
    const supabase = createClient(supabaseUrl, supabaseKey);

    // localStorage key for the offline outbox (notes saved on phone, not yet in cloud)
    const OUTBOX_KEY = 'map-notes-outbox';

    // =========================================================================
    // 🎨  MAP PALETTE — OpenStreetMap (osm-carto) look
    // =========================================================================
    const COLORS = {
      background:      "#ffffff",
      water:           "#aad3df",
      waterway:        "#aad3df",
      greenSpace:      "#c8e6a0",
      urbanArea:       "#e8e3dc",
      building:        "#d9d0c9",
      buildingOutline: "#c6bbb0",
      roadMinor:       "#ffffff",
      roadSecondary:   "#f7d5a8",
      roadPrimary:     "#fcd6a4",
      roadMotorway:    "#e892a2",
      boundary:        "#ac46ac",
    };
    // =========================================================================

    // No label layer → no external font server needed → no CORS/rate-limit issues.
    const mapStyle = {
      version: 8,
      glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
      sources: {
        openmaptiles: { type: "vector", url: "https://tiles.openfreemap.org/planet" }
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": COLORS.background } },
        { id: "water", type: "fill", source: "openmaptiles", "source-layer": "water", paint: { "fill-color": COLORS.water } },
        { id: "waterway", type: "line", source: "openmaptiles", "source-layer": "waterway", paint: { "line-color": COLORS.waterway, "line-width": 1 } },
        { id: "landuse-green", type: "fill", source: "openmaptiles", "source-layer": "landuse", filter: ["in","class","park","grass","forest","nature_reserve","cemetery","meadow"], paint: { "fill-color": COLORS.greenSpace } },
        { id: "landuse-urban", type: "fill", source: "openmaptiles", "source-layer": "landuse", filter: ["in","class","residential","commercial","industrial","retail"], paint: { "fill-color": COLORS.urbanArea } },
        { id: "building", type: "fill", source: "openmaptiles", "source-layer": "building", minzoom: 14, paint: { "fill-color": COLORS.building, "fill-outline-color": COLORS.buildingOutline } },
        { id: "road-minor", type: "line", source: "openmaptiles", "source-layer": "transportation", filter: ["in","class","minor","service","track","path"], paint: { "line-color": COLORS.roadMinor, "line-width": ["interpolate",["linear"],["zoom"],12,0.5,18,2] } },
        { id: "road-secondary", type: "line", source: "openmaptiles", "source-layer": "transportation", filter: ["in","class","secondary","tertiary"], paint: { "line-color": COLORS.roadSecondary, "line-width": ["interpolate",["linear"],["zoom"],10,0.8,18,4] } },
        { id: "road-primary", type: "line", source: "openmaptiles", "source-layer": "transportation", filter: ["in","class","primary","trunk"], paint: { "line-color": COLORS.roadPrimary, "line-width": ["interpolate",["linear"],["zoom"],8,0.8,18,6] } },
        { id: "road-motorway", type: "line", source: "openmaptiles", "source-layer": "transportation", filter: ["==","class","motorway"], paint: { "line-color": COLORS.roadMotorway, "line-width": ["interpolate",["linear"],["zoom"],6,0.8,18,8] } },
        { id: "boundary", type: "line", source: "openmaptiles", "source-layer": "boundary", filter: ["==","admin_level",2], paint: { "line-color": COLORS.boundary, "line-width": 0.8, "line-dasharray": [4,2] } }
      ]
    };

    const map = new maplibregl.Map({
      container: 'map', style: mapStyle,
      center: [12, 45], zoom: 4, attributionControl: false
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    // ─── Location (approximate on desktop; accurate GPS on phone) ─────────────
    let currentPosition = null;
    let hasCentered = false;   // becomes true once we've moved the map to the user
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentPosition = pos.coords;
        // Center on the user as soon as we have a fix (only the first time)
        if (!hasCentered) {
          hasCentered = true;
          map.easeTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 14, duration: 800 });
        }
        navigator.geolocation.watchPosition(
          (p) => { currentPosition = p.coords; }, () => {},
          { enableHighAccuracy: true, maximumAge: 10000 }
        );
      },
      () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );

    // =========================================================================
    // 🔠  ZOOM-DRIVEN FONT SIZE
    // =========================================================================
    const FONT_MIN_PX = 7, FONT_MAX_PX = 15, ZOOM_MIN = 4, ZOOM_MAX = 16;
    const allLabelEls = [];
    function zoomToFontSize(zoom) {
      const t = Math.max(0, Math.min(1, (zoom - ZOOM_MIN) / (ZOOM_MAX - ZOOM_MIN)));
      return FONT_MIN_PX + t * (FONT_MAX_PX - FONT_MIN_PX);
    }
    function updateAllFontSizes() {
      const size = zoomToFontSize(map.getZoom()) + 'px';
      for (const el of allLabelEls) el.style.fontSize = size;
    }
    map.on('zoom', updateAllFontSizes);

    const mapEl = document.getElementById('map');

    // Escape any HTML so notes render as plain text (no formatting).
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showTextLabel(lat, lon, text) {
      const el = document.createElement('div');
      el.className = 'note-label';
      el.textContent = text;   // plain text, no HTML formatting
      el.style.fontSize = zoomToFontSize(map.getZoom()) + 'px';
      allLabelEls.push(el);
      el.addEventListener('mouseenter', () => { mapEl.classList.add('labels-dimmed'); el.classList.add('is-hovered'); });
      el.addEventListener('mouseleave', () => { mapEl.classList.remove('labels-dimmed'); el.classList.remove('is-hovered'); });
      new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lon, lat]).addTo(map);
    }

    // =========================================================================
    // 🔄  SYNC STATUS PILL
    // =========================================================================
    const dotEl  = document.getElementById('sync-dot');
    const textEl = document.getElementById('sync-text');
    function setSync(state, msg) {
      dotEl.className = 'sync-dot ' + (state || '');
      textEl.textContent = msg;
    }

    // =========================================================================
    // 📤  OFFLINE OUTBOX — notes saved on the phone but not yet in the cloud.
    //     They show on the map immediately and re-sync whenever there's signal.
    // =========================================================================
    function getOutbox() {
      try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); }
      catch (_) { return []; }
    }
    function setOutbox(arr) {
      try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(arr)); } catch (_) {}
    }

    // Try to push every queued note to Supabase. Removes ones that succeed.
    let syncing = false;
    async function flushOutbox(showStatus = true) {
      if (syncing) return;
      const queue = getOutbox();
      if (queue.length === 0) { if (showStatus) setSync('ok', 'All notes saved'); return; }
      syncing = true;
      if (showStatus) setSync('pending', `Syncing ${queue.length}…`);

      const remaining = [];
      for (const note of queue) {
        try {
          const { error } = await supabase.from(TABLE).insert([{
            lat: note.lat, lon: note.lon, text: note.text, created_at: note.created_at
          }]);
          if (error) throw error;
        } catch (e) {
          remaining.push(note);   // keep it for next attempt
        }
      }
      setOutbox(remaining);
      syncing = false;

      if (remaining.length === 0) setSync('ok', 'All notes saved');
      else setSync('pending', `${remaining.length} waiting for signal`);
    }

    // Save a note: show it instantly, queue it, try to sync now.
    function addNote(lat, lon, text) {
      const note = { lat, lon, text, created_at: new Date().toISOString() };
      showTextLabel(lat, lon, text);           // instant on map
      const queue = getOutbox();
      queue.push(note);
      setOutbox(queue);                         // safe on phone even if offline
      flushOutbox();                            // attempt cloud save
    }

    // Retry sync when the browser regains connectivity, and periodically.
    window.addEventListener('online', () => flushOutbox());
    setInterval(() => flushOutbox(false), 30000);

    // =========================================================================
    // 📥  LOAD everything: history file + cloud notes, then frame the view.
    // =========================================================================
    async function loadAll() {
      const pts = [];

      // 1. Historical notes committed in the repo
      try {
        const res = await fetch('./notes.json', { cache: 'no-store' });
        const hist = await res.json();
        hist.forEach(n => { showTextLabel(n.lat, n.lon, n.text); pts.push(n); });
      } catch (e) {
        console.warn('notes.json not found (optional):', e);
      }

      // 2. Notes from the cloud database
      try {
        const { data, error } = await supabase.from(TABLE).select('*');
        if (error) throw error;
        data.forEach(n => { showTextLabel(n.lat, n.lon, n.text); pts.push(n); });
        setSync('ok', 'All notes saved');
      } catch (e) {
        console.warn('Supabase load error:', e);
        setSync('err', 'Offline');
      }

      // 3. Any queued notes not yet in the cloud (also show + try to flush)
      const queue = getOutbox();
      queue.forEach(n => { showTextLabel(n.lat, n.lon, n.text); pts.push(n); });
      flushOutbox(false);

      // 4. Do NOT reframe the map here — geolocation centers on the user and
      //    we leave it there. (Fitting all notes would jump to a world view,
      //    since the notes span multiple countries.)
    }

    map.on('load', () => {
      loadAll();
      const attrib = document.querySelector('.maplibregl-ctrl-attrib');
      if (attrib) attrib.classList.add('maplibregl-compact');
    });

    // ─── Toggle base map (hides map canvas only; note markers stay) ────────────
    let baseVisible = true;
    window.toggleBaseMap = () => {
      baseVisible = !baseVisible;
      map.getCanvas().style.visibility = baseVisible ? 'visible' : 'hidden';
      const btn = document.getElementById('toggle-base');
      btn.textContent = baseVisible ? 'Hide base map' : 'Show base map';
      btn.classList.toggle('active', !baseVisible);
      document.body.classList.toggle('base-hidden', !baseVisible);
      mapEl.style.background = baseVisible ? '#f2efe9' : '#ffffff';
    };

    // ─── Drop note: mobile sheet or desktop popup ─────────────────────────────
    const isMobile = () => window.innerWidth < 600;

    // Mobile sheet
    const overlay   = document.getElementById('mobile-sheet-overlay');
    const sheetTA    = document.getElementById('sheet-textarea');
    const sheetSave  = document.getElementById('sheet-save');
    const sheetClose = document.getElementById('sheet-close');
    let sheetLngLat  = null;

    function openSheet(lngLat) { sheetLngLat = lngLat; sheetTA.value = ''; overlay.classList.add('open'); setTimeout(() => sheetTA.focus(), 350); }
    function closeSheet() { overlay.classList.remove('open'); }
    sheetClose.onclick = closeSheet;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

    sheetSave.onclick = () => {
      const text = sheetTA.value.trim();
      if (!text) { sheetTA.focus(); return; }
      addNote(sheetLngLat[1], sheetLngLat[0], text);
      closeSheet();
    };

    // Desktop popup
    function openDesktopPopup(lngLat) {
      const container = document.createElement('div');
      container.className = 'note-popup';

      const heading = document.createElement('h3');
      heading.textContent = 'Leave a note';
      container.appendChild(heading);

      const textarea = document.createElement('textarea');
      textarea.rows = 4;
      textarea.placeholder = "Write your note here…";
      container.appendChild(textarea);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = 'Save Note';
      container.appendChild(saveBtn);

      const popup = new maplibregl.Popup({ closeButton: true, maxWidth: '300px' })
        .setLngLat(lngLat).setDOMContent(container).addTo(map);

      saveBtn.onclick = () => {
        const text = textarea.value.trim();
        if (!text) return alert("Note can't be empty");
        addNote(lngLat[1], lngLat[0], text);
        popup.remove();
      };
    }

    // Unified entry point — drops a note at your current location
    window.dropNote = () => {
      if (!currentPosition) { alert("Still getting your location…"); return; }
      const lngLat = [currentPosition.longitude, currentPosition.latitude];
      if (isMobile()) openSheet(lngLat);
      else openDesktopPopup(lngLat);
    };

    // =========================================================================
    // 📍  DROP A NOTE ANYWHERE — click (desktop) / long-press (mobile)
    // =========================================================================
    function openNoteAt(lngLat) {
      if (isMobile()) openSheet(lngLat);
      else openDesktopPopup(lngLat);
    }

    // Desktop: a plain click on the map drops a note there.
    map.on('click', (e) => {
      if (isMobile()) return;
      openNoteAt([e.lngLat.lng, e.lngLat.lat]);
    });

    // Mobile: long-press (~550ms) drops a note at the pressed point.
    const LONG_PRESS_MS = 550;
    const MOVE_TOLERANCE = 12;   // px of movement allowed before it's a pan
    let pressTimer = null;
    let pressStart = null;

    const canvas = map.getCanvasContainer();

    function clearPress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      pressStart = null;
    }

    canvas.addEventListener('touchstart', (ev) => {
      if (ev.touches.length !== 1) { clearPress(); return; }  // ignore pinch
      const t = ev.touches[0];
      pressStart = { x: t.clientX, y: t.clientY };
      const point = map.unproject([
        t.clientX - canvas.getBoundingClientRect().left,
        t.clientY - canvas.getBoundingClientRect().top
      ]);
      pressTimer = setTimeout(() => {
        pressTimer = null;
        if (navigator.vibrate) navigator.vibrate(15);
        openNoteAt([point.lng, point.lat]);
      }, LONG_PRESS_MS);
    }, { passive: true });

    canvas.addEventListener('touchmove', (ev) => {
      if (!pressStart || !ev.touches.length) return;
      const t = ev.touches[0];
      const dx = t.clientX - pressStart.x;
      const dy = t.clientY - pressStart.y;
      if (Math.hypot(dx, dy) > MOVE_TOLERANCE) clearPress();  // it's a pan
    }, { passive: true });

    canvas.addEventListener('touchend', clearPress, { passive: true });
    canvas.addEventListener('touchcancel', clearPress, { passive: true });
  </script>
</body>
</html>
