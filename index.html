<!DOCTYPE html>
<html>
<head>
  <title>Map Notes</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

  <style>
    /* One text size and style for everything on the page: notes and menu */
    :root {
      --text-size: 13px;
      --text-font: 'Arial Narrow', 'Times New Roman', serif;
      --text-glow: 0 0 4px #e892a2, 0 0 4px #e892a2, 0 0 3px #e892a2;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; background: #f2efe9; }

    /* ── Notes on the map ─────────────────────────────────────── */
    .note-label {
      background: transparent;
      font-family: var(--text-font);
      font-size: var(--text-size);
      color: #000;
      text-shadow: var(--text-glow);
      line-height: 1.25;
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
      text-align: left;
      cursor: default;
      transition: opacity 0.2s ease;
      opacity: 1;
    }
    .note-title { font-weight: bold; }
    .note-desc, .note-long { display: none; }
    .note-long { white-space: pre-line; }

    /* Region level: short line under the title */
    .zoom-mid .note-desc { display: block; }
    /* Close up: the longer description (or the short line if there is none) */
    .zoom-near .note-label.has-long { max-width: 280px; }
    .zoom-near .note-long { display: block; }
    .zoom-near .note-label:not(.has-long) .note-desc { display: block; }

    /* !important because MapLibre sets an inline opacity on every marker */
    .labels-dimmed .note-label { opacity: 0.15 !important; }
    .note-label.is-hovered { opacity: 1 !important; z-index: 1; }

    /* ── Category menu ────────────────────────────────────────── */
    .legend {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 12px;
      z-index: 1000;
      font-family: var(--text-font);
      font-size: var(--text-size);
      line-height: 1.25;
      color: #000;
      text-shadow: var(--text-glow);
    }
    .legend label {
      display: flex; align-items: center; gap: 7px;
      padding: 2px 0;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .legend input { margin: 0; width: 12px; height: 12px; accent-color: #000; cursor: pointer; }
    .legend .count { margin-left: 4px; }

    .maplibregl-ctrl-attrib.maplibregl-compact { min-width: 24px; }
    .maplibregl-ctrl-attrib-button { display: block !important; }
  </style>
</head>
<body>
  <div style="color:#0088ff" id="map"></div> 
  <nav id="legend" class="legend" aria-label="Show on the map"></nav>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="map-notes.js"></script>
  <script>
    // =========================================================================
    // 🎨  MAP PALETTE: fields, rock, coastline, buildings and borders
    // =========================================================================
    const COLORS = {
      background:      "#ffffff",
      fields:          "#eef0d5",  // farmland, orchards, vineyards
      rock:            "#eef0d5",  // bare rock and scree
      water:           "#ffffff",
      building:        "#d9d0c9",
      buildingOutline: "#d9d0c9",
      boundary:        "#e892a2",
    };

    const mapStyle = {
      version: 8,
      sources: {
        openmaptiles: { type: "vector", url: "https://tiles.openfreemap.org/planet" }
      },
      layers: [
        { id: "background", type: "background", paint: { "background-color": COLORS.background } },
        { id: "fields", type: "fill", source: "openmaptiles", "source-layer": "landcover", filter: ["==","class","farmland"], paint: { "fill-color": COLORS.fields } },
        { id: "rock", type: "fill", source: "openmaptiles", "source-layer": "landcover", filter: ["==","class","rock"], paint: { "fill-color": COLORS.rock } },
        { id: "water", type: "fill", source: "openmaptiles", "source-layer": "water", paint: { "fill-color": COLORS.water } },
        { id: "building", type: "fill", source: "openmaptiles", "source-layer": "building", minzoom: 14, paint: { "fill-color": COLORS.building, "fill-outline-color": COLORS.buildingOutline } },
        {
  id: "funicular-lines",
  type: "line",
  source: "openmaptiles", // Replace with your exact source ID if different
  "source-layer": "transportation",
  filter: ["==", ["get", "subclass"], "funicular"],
  paint: {
    "line-color": COLORS.funicular || "#ff5500", // Fallback hex color if COLORS.funicular is undefined
    "line-width": 2
  }
},

        { id: "boundary", type: "line", source: "openmaptiles", "source-layer": "boundary", filter: ["==","admin_level",2], paint: { "line-color": COLORS.boundary, "line-width": 0.8, "line-dasharray": [4,2] } }
      ]
    };

    // Opening view: Europe at country level (Atlantic coast of Portugal → Romania, Sicily → Denmark).
    // fitBounds adapts the zoom to the screen, so phones get the whole frame too.
    const EUROPE_BOUNDS = [[-12, 36], [30, 58]];
    const map = new maplibregl.Map({
      container: 'map', style: mapStyle,
      bounds: EUROPE_BOUNDS, fitBoundsOptions: { padding: 20 },
      attributionControl: false
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
    map.on('load', () => {
      const attrib = document.querySelector('.maplibregl-ctrl-attrib');
      if (attrib) attrib.classList.add('maplibregl-compact');
    });

    // =========================================================================
    // 🔎  WHAT EACH NOTE SHOWS, BY ZOOM
    //     below SHORT_MIN_ZOOM: title only
    //     from SHORT_MIN_ZOOM:  title + short line (`text`)
    //     from LONG_MIN_ZOOM:   title + longer description (`long`)
    // =========================================================================
    const SHORT_MIN_ZOOM = 5;    // roughly region level
    const LONG_MIN_ZOOM  = 14;   // roughly street level
    const STACK_GAP_PX   = 3;    // space between notes that would otherwise overlap

    // =========================================================================
    // 🗂  CATEGORIES (from map-notes.js)
    // =========================================================================
    const categories = new Map();
    (window.MAP_CATEGORIES || [{ id: 'works', label: 'Works' }])
      .forEach(c => categories.set(c.id, { ...c, visible: true }));
    function categoryOf(n) {
      const id = n.category || 'works';
      if (!categories.has(id)) categories.set(id, { id, label: id, visible: true });
      return categories.get(id);
    }

    // =========================================================================
    // 📍  NOTES
    // =========================================================================
    const mapEl = document.getElementById('map');
    const notes = [];   // { data, cat, el, marker }

    function addLine(el, className, text) {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = text;
      el.appendChild(div);
    }

    function showNote(n) {
      const el = document.createElement('div');
      el.className = 'note-label';
      addLine(el, 'note-title', n.title || '');
      if (n.text) addLine(el, 'note-desc', n.text);
      if (n.long) { addLine(el, 'note-long', n.long); el.classList.add('has-long'); }

      el.addEventListener('mouseenter', () => { mapEl.classList.add('labels-dimmed'); el.classList.add('is-hovered'); });
      el.addEventListener('mouseleave', () => { mapEl.classList.remove('labels-dimmed'); el.classList.remove('is-hovered'); });

      const marker = new maplibregl.Marker({ element: el, anchor: 'left' })
        .setLngLat([n.lon, n.lat]).addTo(map);
      notes.push({ data: n, cat: categoryOf(n), el, marker });
    }

    // Notes that would overlap on screen (e.g. several items in one city when
    // zoomed out) are stacked downwards from the northernmost one. As you zoom
    // in they spread apart and settle back on their own locations.
    function declutter() {
      const items = notes.filter(n => n.cat.visible).map(n => {
        const p = map.project([n.data.lon, n.data.lat]);
        return { n, x: p.x, y: p.y, w: n.el.offsetWidth, h: n.el.offsetHeight };
      }).sort((a, b) => a.y - b.y || a.x - b.x);

      const placed = [];
      for (const it of items) {
        const left = it.x, right = it.x + it.w;   // labels start at their point
        const home = it.y - it.h / 2;
        let top = home;
        for (let moved = true; moved; ) {
          moved = false;
          for (const o of placed) {
            if (left < o.right && right > o.left &&
                top < o.bottom + STACK_GAP_PX && top + it.h > o.top - STACK_GAP_PX) {
              top = o.bottom + STACK_GAP_PX;
              moved = true;
            }
          }
        }
        placed.push({ left, right, top, bottom: top + it.h });
        it.n.marker.setOffset([0, top - home]);
      }
    }

    function relayout() {
      const zoom = map.getZoom();
      mapEl.classList.toggle('zoom-mid',  zoom >= SHORT_MIN_ZOOM && zoom < LONG_MIN_ZOOM);
      mapEl.classList.toggle('zoom-near', zoom >= LONG_MIN_ZOOM);
      declutter();
    }

    // =========================================================================
    // 🗂  MENU: one toggle per category that has notes on the map
    // =========================================================================
    function buildLegend() {
      const legend = document.getElementById('legend');
      for (const cat of categories.values()) {
        const count = notes.filter(n => n.cat === cat).length;
        if (!count) continue;

        const label = document.createElement('label');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = cat.visible;
        box.addEventListener('change', () => {
          cat.visible = box.checked;
          for (const n of notes) if (n.cat === cat) n.el.style.display = cat.visible ? '' : 'none';
          relayout();
        });

        const name = document.createElement('span');
        name.textContent = cat.label;
        const num = document.createElement('span');
        num.className = 'count';
        num.textContent = '(' + count + ')';

        label.append(box, name, num);
        legend.appendChild(label);
      }
      if (!legend.children.length) legend.remove();
    }

    // =========================================================================
    // 📥  LOAD the notes from map-notes.js
    // =========================================================================
    if (!window.MAP_NOTES) console.warn('map-notes.js not found or empty');
    (window.MAP_NOTES || [])
      .filter(n => typeof n.lat === 'number' && typeof n.lon === 'number')
      .forEach(showNote);

    buildLegend();
    relayout();
    map.on('zoom', relayout);
    map.on('rotate', relayout);
    map.on('pitch', relayout);
    if (document.fonts) document.fonts.ready.then(relayout);
  </script>
</body>
</html>
