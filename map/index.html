<!DOCTYPE html>
<html>
<head>
  <title>Mappa Matte</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-color: #d6e7eb;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      background-color: #d6ebdd;
    }

    #text {
      position: fixed;
      top: 0vh;
      left: 10vw;
      width: 50vw;
      text-align: left;
      z-index: 1000;
      font-family: 'Comic Sans MS';
      font-size: 40px;
      background-color: transparent;
      cursor: pointer;
    }

    .leaflet-control-zoom {
      display:none;
    }

    .note-label {
      background: transparent;
      padding: 3px 5px;
      border-radius: 6px;
      white-space: nowrap;
      font-family: 'Comic Sans MS';
      color: inherit;
      text-align: center;
      line-height: 1.4;
    }

    .leaflet-popup-content-wrapper {
      background: white;
      color: black;
      font-family: 'Comic Sans MS';
      border-radius: 8px;
      padding: 10px;
    }

    .leaflet-popup-tip {
      background: transparent;
    }

    .leaflet-popup-content {
      font-size: 1.2em;
      text-align: center;
      margin: 0;
    }

    #filter {
      position: fixed;
      left: 10px;
      bottom: 10px;
      top: 10px;
      background: transparent;
      border-radius: 8px;
      padding: 10px;
      font-family: sans-serif;
      z-index: 1001;
      max-height: 100vh;
      width: 7vw;
      overflow-y: auto;
      scrollbar-color: transparent transparent;
      font-size: 14px;
      
    }

    .filter-btn {
      font-size: 3em;
      cursor: pointer;
      margin: 2px;
      padding: 1px 1px;
      border: none;
      background: transparent;
      opacity: 100%;
    }

    .filter-btn.active {
      background-color: transparent;
      opacity: 100%;
    }

    .filter-btn:not(.active) {
      opacity: 50%;
    }

    /* Detail Panel - Desktop */
    .detail-view {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      border-radius: 50px;
      width: 35vw;
      height: 94vh;
      overflow-y: auto;
      z-index: 100;
      padding: 20px;
      background: #ffffff;
      border-left: 1px solid rgb(235, 235, 235);
    }

    .detail-view.open {
      display: block;
    }

    .detail-content {
      max-width: 100%;
      padding-bottom: 80px;
      text-align: center ;
    }

    .detail-header {
      margin-bottom: 20px;
      text-align: center;
      padding-bottom: 15px;
    }

    .detail-emoji {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .detail-name {
      font-size: 1em;
      margin-bottom: 8px;
      font-weight: normal;
    }

    .detail-category {
      font-size: 0.75em;
      color: rgb(0, 0, 0);
      margin-bottom: 5px;
    }

    .detail-coords {
      font-size: 0.75em;
      color: rgb(77, 77, 77);
      font-family: monospace;
    }

    .detail-description {
      font-size: 0.9em;
      line-height: 1.6;
      color: rgb(60, 60, 60);
      margin-top: 20px;
    }

    .detail-description p {
      margin-bottom: 12px;
    }

    .close-btn {
      border-radius: 20px;
      position: fixed;
      bottom: 30px;
      right: calc(35vw / 2 - 40px);
      padding: 12px 30px;
      font-family: inherit;
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.47);
      cursor: pointer;
      border: none;
      z-index: 101;
      transition: opacity 0.2s ease;
    }

    .close-btn:hover {
      opacity: 0.5;
    }


    /* Mobile styles */
    @media (max-width: 768px) {
      #map {
        bottom: 0;
      }

      .detail-view {
        width: 100vw;
        height: calc(50vh - 10px);
        top: auto;
        align-items: center;
        bottom: -50vh;
        left: 2%;
        right: 2%;
        border-radius: 20px 20px 0 0;
        border-left: none;
        border-top: 1px solid rgb(220, 220, 220);
        padding: 0;
        display: flex;
        flex-direction: column;
        transition: bottom 0.3s ease;
      }

      .detail-view.open {
        display: flex;
        bottom: 10px;
      }

      .detail-content {
        flex: 1;
        overflow-y: auto;
        padding: 30px 35px 100px 35px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .detail-header {
        text-align: center;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgb(240, 240, 240);
        width: 100%;
        max-width: 300px;
      }

      .detail-emoji {
        font-size: 2.5em;
        margin-bottom: 12px;
      }

      .detail-name {
        font-size: 1.1em;
        margin-bottom: 8px;
        line-height: 1.4;
      }

      .detail-category {
        font-size: 0.8em;
        margin-bottom: 6px;
      }

      .detail-coords {
        font-size: 0.7em;
      }

      .detail-description {
        text-align: center;
        font-size: 0.9em;
        line-height: 1.75;
        margin-top: 10px;
        max-width: 300px;
        color: rgb(80, 80, 80);
      }

      .detail-description p {
        margin-bottom: 10px;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        bottom: auto;
        left: auto;
        transform: none;
        padding: 8px 18px;
        font-size: 0.8em;
        background: rgba(255, 255, 255, 1);
      }

#filter {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: 20px;
  top: auto;
  width: auto;
  max-height: none;
  font-size: 25px;
  height: fit-content;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0);
  border-radius: 12px;
  transition: bottom 0.3s ease;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 2px;
  
}

      #filter.panel-open {
        bottom: calc(50vh + 10px);
      }

      .filter-btn {
        font-size: 1.3em;
        margin: 3px;
        padding: 5px 7px;
      }

      #text {
        font-size: 24px;
        left: 5vw;
      }

    }

    @media (max-width: 400px) {
      .detail-content {
        padding: 25px 30px 90px 30px;
      }

        max-width: 260px;
      }

        max-width: 260px;
        font-size: 0.85em;
        line-height: 1.7;
      }

      .detail-name {
        font-size: 1em;
      }

      .filter-btn {
        font-size: 1.1em;
        margin: 2px;
        padding: 4px 5px;
      }

      #filter {
        padding: 6px;
      }
    }

const emojiLayers = {};
    const emojiMarkers = {};
    const filterDiv = document.getElementById('filter');
    const detailView = document.getElementById('detail-view');
    const detailContent = document.getElementById('detail-content');
    const mapEl = document.getElementById('map');

    const uniqueEmojis = [...new Set(points.map(p => p.emoji))];
    let activeFilter = null; // null = tutti visibili, altrimenti = emoji selezionato

    // Crea bottone "mostra tutti"
    const showAllBtn = document.createElement('button');
    showAllBtn.innerText = '🔄';
    showAllBtn.className = 'filter-btn';
    showAllBtn.style.opacity = '50%';
    showAllBtn.title = 'Mostra tutti';
    showAllBtn.addEventListener('click', () => {
      activeFilter = null;
      uniqueEmojis.forEach(emoji => {
        map.addLayer(emojiLayers[emoji]);
      });
      updateFilterButtons();
    });
    filterDiv.appendChild(showAllBtn);

    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn[data-emoji]').forEach(btn => {
        if (activeFilter === null) {
          btn.classList.add('active');
        } else {
          btn.classList.toggle('active', btn.dataset.emoji === activeFilter);
        }
      });
      // Mostra/nascondi bottone reset
      showAllBtn.style.opacity = activeFilter === null ? '50%' : '100%';
    }

    uniqueEmojis.forEach(emoji => {
      emojiLayers[emoji] = L.layerGroup().addTo(map);
      emojiMarkers[emoji] = [];

      const btn = document.createElement('button');
      btn.innerText = emoji;
      btn.className = 'filter-btn active';
      btn.dataset.emoji = emoji;
      btn.addEventListener('click', () => {
        if (activeFilter === emoji) {
          // Se clicchi di nuovo sullo stesso, torna a mostrare tutti
          activeFilter = null;
          uniqueEmojis.forEach(e => map.addLayer(emojiLayers[e]));
        } else {
          // Mostra solo questo
          activeFilter = emoji;
          uniqueEmojis.forEach(e => {
            if (e === emoji) {
              map.addLayer(emojiLayers[e]);
            } else {
              map.removeLayer(emojiLayers[e]);
            }
          });
        }
        updateFilterButtons();
      });
      filterDiv.appendChild(btn);
    });

    // Function to open detail panel
    function openDetail(point) {
      const categoryName = categoryNames[point.emoji] || point.emoji;
      
      detailContent.innerHTML = `
        <div class="detail-header">
          <div class="detail-emoji">${point.emoji}</div>
          <div class="detail-name">${point.name}</div>
          <div class="detail-category">${categoryName}</div>
          <div class="detail-coords">${point.lat.toFixed(5)}, ${point.lon.toFixed(5)}</div>
        </div>
        <div class="detail-description">
          <p>${point.description}</p>
        </div>
      `;
      
      detailView.classList.add('open');
      mapEl.classList.add('panel-open');
      filterDiv.classList.add('panel-open');
    }

    // Function to close detail panel
    function closeDetail() {
      detailView.classList.remove('open');
      mapEl.classList.remove('panel-open');
      filterDiv.classList.remove('panel-open');
    }

    // Create markers
    points.forEach((point) => {
      const { lat, lon, name, emoji } = point;
      
      const emojiIcon = L.divIcon({
        className: 'note-label',
        html: `<div style="font-size: 7em;">${emoji}</div>`,
        iconSize: [20, 20],
      });

      const marker = L.marker([lat, lon], { 
        icon: emojiIcon,
        autoPan: false
      });
      
      // Click to open detail panel
      marker.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e);
        e.originalEvent.stopPropagation();
        e.originalEvent.preventDefault();
        openDetail(point);
      });

      marker.addTo(emojiLayers[emoji]);
      emojiMarkers[emoji].push(marker);
    });

    // Close button
    document.getElementById('detail-close').addEventListener('click', closeDetail);

    // ESC key to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDetail();
      }
    });


    // Zoom-based resizing
    map.on('zoomend', () => {
      const zoom = map.getZoom();
      const scale = Math.max(0.6, Math.min(1.5, zoom / 14));
      document.querySelectorAll('.note-label').forEach(label => {
        label.style.fontSize = `${scale}em`;
      });
    });

    // Reset view on click
    document.getElementById('text').addEventListener('click', () => {
      map.flyTo(defaultCenter, defaultZoom);
      closeDetail();
    });
  </script>
